hero:
  title:
    en: '<b>Product Designer</b> <span>with Superpowers</span>'
    ru: '<b>Product-дизайнер</b> <span>со сверхспособностями</span>'
  desc:
    en: 'You don’t just need design — you need growth in conversion, retention, and revenue. I’m a product designer specializing in complex interfaces and UI systems. I work at the intersection of design and development (Figma → Storybook → CI) and help bring products to market faster.'
    ru: 'Вам ведь нужен не просто дизайн, а рост конверсии, удержания и выручки? А я — продуктовый дизайнер с экспертизой в сложных интерфейсах и UI-системах. Работаю на стыке дизайна и разработки (Figma → Storybook → CI) и помогаю быстрее выводить продукт на рынок.'
  alt:
    en: "My portrait. Here I am still young and handsome, now I'm just handsome"
    ru: 'Мой портрет. Здесь я еще молод и красив, сейчас просто красив'
  latest-work:
    alt:
      en: 'Latest work'
      ru: 'Последняя работа'
    img: '2025-05-12'
    link: '26012874-Echo-Immortal-Designing-the-UI-for-a-Digital-Afterlife'

services:
  desc:
    en: 'My skill set addresses two types of client needs. <b>First,</b> a product designer within a development team: UX/UI plus building and maintaining a design system. <b>Second,</b> a technical partner for small businesses: fixing and configuring things that couldn’t be handled by whoever built your site on Framer, WordPress, or Aura.'
    ru: 'Набор моих навыков закрывает два типа потребностей клиентов.<br><b class="nobr">Во-первых,</b> продуктовый дизайнер в команду разработки: UX/UI + создание и поддержка дизайн-системы. <b class="nobr">Во-вторых,</b> технический партнёр малого бизнеса: чинить и настраивать то, что не может человек, который делал вам сайт на Tild’e, WordPress’е, Framer’е или Aur’е.'

about:
  kpi:
    first:
      en: 'conversion'
      ru: 'конверсии'

  desc:
    en: '<strong>My name is Vladimir Nikishin</strong>, and SuperMark is my personal brand. I have a background in journalism but built my career in the digital industry. The numbers above highlight results from one of my previous projects. I could also add: NPS growth from 27 to 56, 61% faster order placement, 72% faster instrument search, and more. The point behind all these metrics is simple — with the right person, you can achieve real results too.'
    ru: '<strong>Меня зовут Владимир Никишин</strong>, а SuperMark — это моя торговая марка. Журналист по образованию, но карьеру сделал в диджитал-индустрии. На карточках выше — красивые цифры результатов, которых достиг в одном из своих предыдущих проектов. Там можно ещё добавить NPS: 27 → 56, ускорение размещение ордера на 61 %, поиск инструмента на 72 % и т.д. и т.п. А суть этой арифметики в том, что и вы сможете чего-то добиться с правильным человеком.'

  ai-note:
    en: 'And with the help of ChatGPT, Codex, and Claude, all of these skills reach 95%. I’m convinced that 100-percent mastery of any craft is unattainable, even for AI.'
    ru: 'А с помощью ChatGPT, Codex и Claude все эти навыки достигают 95%. 100-процентное владение любым ремеслом, уверен, недостижимо даже для ИИ.'

